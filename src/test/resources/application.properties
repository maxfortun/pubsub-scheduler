# Test configuration - disable DevServices that require Docker

# Use random port to avoid conflicts
quarkus.http.test-port=0

# Disable all DevServices
quarkus.devservices.enabled=false

# Disable specific DevServices
quarkus.datasource.devservices.enabled=false
quarkus.kafka.devservices.enabled=false

# AWS DevServices
quarkus.secretsmanager.devservices.enabled=false
quarkus.ssm.devservices.enabled=false

# Use mock/in-memory for tests
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=RUNSCRIPT FROM 'classpath:db/init-h2.sql'
quarkus.datasource.username=sa
quarkus.datasource.password=

# Scheduler configuration
scheduler.instance-id=test-instance
scheduler.api.max-limit=1000
scheduler.mode=sharded
scheduler.heartbeat.interval-seconds=30
scheduler.heartbeat.stale-threshold-seconds=120
scheduler.catchup.enabled=false
scheduler.catchup.interval=60s
scheduler.default-retries=3
scheduler.default-advisory-headers=.*

# Camel endpoints for tests (using direct: for in-memory)
scheduler.in=direct:scheduler-in
scheduler.out=direct:scheduler-out
scheduler.dlq=direct:scheduler-dlq
scheduler.advisory=direct:scheduler-advisory
scheduler.advisory.dlq=direct:scheduler-advisory-dlq
scheduler.consumer-group=test-consumer-group

# Camel - disable XML routes for unit tests, use minimal test routes
camel.main.routes-include-pattern=false
