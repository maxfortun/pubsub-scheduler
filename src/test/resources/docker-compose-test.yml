services:
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka
    container_name: pubsub-scheduler-test
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: postgres-scheduler-test
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: scheduler
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
    volumes:
      - ./db/init-postgresql.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler"]
      interval: 5s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.0
    container_name: mysql-scheduler-test
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: scheduler
      MYSQL_USER: scheduler
      MYSQL_PASSWORD: scheduler
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./db/init-mysql.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "scheduler", "-pscheduler"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  cockroachdb:
    image: cockroachdb/cockroach:v24.1.0
    container_name: cockroachdb-scheduler-test
    command: start-single-node --insecure --store=type=mem,size=1GiB
    ports:
      - "26257:26257"
      - "8080:8080"
    environment:
      COCKROACH_DATABASE: scheduler
      COCKROACH_USER: scheduler
    volumes:
      - ./db/init-cockroachdb.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health?ready=1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui-scheduler-test
    ports:
      - "9001:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: scheduler-test
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: 'true'
    depends_on:
      kafka:
        condition: service_healthy

  scheduler-postgres:
    image: pubsub-scheduler:test
    container_name: scheduler-postgres
    ports:
      - "8091:8080"
    env_file:
      - ./docker/scheduler-postgres.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CAMEL_COMPONENT_KAFKA_BROKERS: kafka:29092
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/scheduler
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/q/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  scheduler-mysql:
    image: pubsub-scheduler:test
    container_name: scheduler-mysql
    ports:
      - "8092:8080"
    env_file:
      - ./docker/scheduler-mysql.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CAMEL_COMPONENT_KAFKA_BROKERS: kafka:29092
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:mysql://mysql:3306/scheduler
    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/instances || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  scheduler-cockroach:
    image: pubsub-scheduler:test
    container_name: scheduler-cockroach
    ports:
      - "8093:8080"
    env_file:
      - ./docker/scheduler-cockroach.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CAMEL_COMPONENT_KAFKA_BROKERS: kafka:29092
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://cockroachdb:26257/scheduler?sslmode=disable
    depends_on:
      kafka:
        condition: service_healthy
      cockroachdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/q/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
