# =============================================================================
# ActiveMQ Messaging Configuration Example
# =============================================================================
# Use this configuration when running the scheduler with Apache ActiveMQ.
# Supports ActiveMQ Classic and ActiveMQ Artemis.
#
# Copy this to application.properties or set as environment variables.
# =============================================================================

# -----------------------------------------------------------------------------
# Camel Routes (switch to ActiveMQ routes)
# -----------------------------------------------------------------------------
camel.main.routesIncludePattern=classpath:camel/activemq.xml

# -----------------------------------------------------------------------------
# ActiveMQ Broker Connection
# -----------------------------------------------------------------------------
# For ActiveMQ Classic or Artemis
camel.component.activemq.brokerUrl=${CAMEL_COMPONENT_ACTIVEMQ_BROKERURL:tcp://localhost:61616}
camel.component.activemq.username=${CAMEL_COMPONENT_ACTIVEMQ_USERNAME:admin}
camel.component.activemq.password=${CAMEL_COMPONENT_ACTIVEMQ_PASSWORD:admin}

# -----------------------------------------------------------------------------
# Scheduler Endpoints (ActiveMQ queues/topics)
# -----------------------------------------------------------------------------
# Inbound schedule requests (queue for point-to-point)
scheduler.in=${SCHEDULER_IN:activemq:queue:scheduler.in}

# Dead letter queue for failed ingests
scheduler.dlq=${SCHEDULER_DLQ:activemq:queue:scheduler.dlq}

# Advisory events (topic for pub/sub)
scheduler.advisory=${SCHEDULER_ADVISORY:activemq:topic:scheduler.advisory}

# Dead letter queue for failed advisories
scheduler.advisory.dlq=${SCHEDULER_ADVISORY_DLQ:activemq:queue:scheduler.advisory.dlq}

# Consumer group (used for JMS client ID)
scheduler.consumer-group=${SCHEDULER_CONSUMER_GROUP:scheduler-group}

# -----------------------------------------------------------------------------
# Database (MySQL example - works well with ActiveMQ deployments)
# -----------------------------------------------------------------------------
quarkus.datasource.db-kind=mysql
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:mysql://localhost:3306/scheduler}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:scheduler}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:scheduler}

# -----------------------------------------------------------------------------
# Instance Identity
# -----------------------------------------------------------------------------
scheduler.instance-id=${HOSTNAME:scheduler-0}

# -----------------------------------------------------------------------------
# ActiveMQ SSL/TLS (optional)
# -----------------------------------------------------------------------------
# For SSL connections, use ssl:// protocol:
# camel.component.activemq.brokerUrl=ssl://activemq:61617
#
# And configure truststore:
# camel.component.activemq.trustStore=/path/to/truststore.jks
# camel.component.activemq.trustStorePassword=changeit
#
# For mutual TLS (client cert):
# camel.component.activemq.keyStore=/path/to/keystore.jks
# camel.component.activemq.keyStorePassword=changeit

# -----------------------------------------------------------------------------
# ActiveMQ Connection Pooling (optional tuning)
# -----------------------------------------------------------------------------
# camel.component.activemq.maxConnections=8
# camel.component.activemq.connectionIdleTimeout=30000
