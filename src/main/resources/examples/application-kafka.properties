# =============================================================================
# Kafka Messaging Configuration Example
# =============================================================================
# Use this configuration when running the scheduler with Apache Kafka.
# This is the default messaging backend.
#
# Copy this to application.properties or set as environment variables.
# =============================================================================

# -----------------------------------------------------------------------------
# Camel Routes (Kafka is default, no change needed)
# -----------------------------------------------------------------------------
# camel.main.routesIncludePattern=classpath:camel/kafka.xml

# -----------------------------------------------------------------------------
# Kafka Broker Connection
# -----------------------------------------------------------------------------
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
camel.component.kafka.brokers=${CAMEL_COMPONENT_KAFKA_BROKERS:localhost:9092}

# -----------------------------------------------------------------------------
# Scheduler Endpoints (Kafka topics)
# -----------------------------------------------------------------------------
# Inbound schedule requests
scheduler.in=${SCHEDULER_IN:kafka:scheduler.in}

# Dead letter queue for failed ingests
scheduler.dlq=${SCHEDULER_DLQ:kafka:scheduler.dlq}

# Advisory events (job lifecycle)
scheduler.advisory=${SCHEDULER_ADVISORY:kafka:scheduler.advisory}

# Dead letter queue for failed advisories
scheduler.advisory.dlq=${SCHEDULER_ADVISORY_DLQ:kafka:scheduler.advisory.dlq}

# Consumer group for Kafka
scheduler.consumer-group=${SCHEDULER_CONSUMER_GROUP:scheduler-group}

# -----------------------------------------------------------------------------
# Database (PostgreSQL example)
# -----------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/scheduler}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:scheduler}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:scheduler}

# -----------------------------------------------------------------------------
# Instance Identity
# -----------------------------------------------------------------------------
scheduler.instance-id=${HOSTNAME:scheduler-0}

# -----------------------------------------------------------------------------
# For Kafka security options, see:
# - application-kafka-ssl.properties (TLS encryption)
# - application-kafka-sasl-plain.properties (username/password)
# - application-kafka-sasl-scram.properties (SCRAM authentication)
# - application-kafka-oauthbearer.properties (OAuth 2.0 / OIDC)
# -----------------------------------------------------------------------------
