# Scheduler configuration (common)

# Instance identity (uses hostname by default - unique per container/pod)
scheduler.instance-id=${HOSTNAME:scheduler-0}

# Scheduler mode: sharded (memory-efficient) or replicated (low-latency)
# - sharded: each instance owns a subset of jobs based on key hash
# - replicated: all instances have all jobs in memory, acquire() deduplicates
scheduler.mode=${SCHEDULER_MODE:sharded}

# Heartbeat configuration for dynamic shard discovery
# Instances heartbeat to DB; shards assigned by ranking live instances
scheduler.heartbeat.interval-seconds=${SCHEDULER_HEARTBEAT_INTERVAL:30}
scheduler.heartbeat.stale-threshold-seconds=${SCHEDULER_HEARTBEAT_STALE:120}

# Job preload - load jobs from JSON file on startup (creates if not exists by jobKey)
# scheduler.preload.file=/path/to/preload-jobs.json
# scheduler.preload.classpath=preload-jobs.json

# Catch-up scan for jobs that landed on wrong instance (sharded mode only)
# Disabled automatically in replicated mode
scheduler.catchup.enabled=${SCHEDULER_CATCHUP_ENABLED:true}
scheduler.catchup.interval=${SCHEDULER_CATCHUP_INTERVAL:60s}

# Default retry policy (can be overridden per-job via SCHEDULER_RETRY_COUNT header)
scheduler.default-retries=3

# API configuration
scheduler.api.max-limit=${SCHEDULER_API_MAX_LIMIT:1000}

# Default advisory header filter (regex for non-SCHEDULER_ headers to include)
scheduler.default-advisory-headers=.*

# Kafka consumer group
scheduler.consumer-group=${SCHEDULER_CONSUMER_GROUP:pubsub-scheduler}

# Transform plugins - pre-scheduling transform (before storage)
scheduler.transform.pre.type=${SCHEDULER_PRE_TYPE:}
scheduler.transform.pre.http.url=${SCHEDULER_PRE_HTTP_URL:}
scheduler.transform.pre.http.method=${SCHEDULER_PRE_HTTP_METHOD:POST}
scheduler.transform.pre.http.threshold-bytes=${SCHEDULER_PRE_HTTP_THRESHOLD:0}
scheduler.transform.pre.http.authorization=${SCHEDULER_PRE_HTTP_AUTH:}
scheduler.transform.pre.http.connect-timeout-ms=${SCHEDULER_PRE_HTTP_CONNECT_TIMEOUT:5000}
scheduler.transform.pre.http.read-timeout-ms=${SCHEDULER_PRE_HTTP_READ_TIMEOUT:30000}

# Transform plugins - post-scheduling transform (before fire)
scheduler.transform.post.type=${SCHEDULER_POST_TYPE:}
scheduler.transform.post.http.url=${SCHEDULER_POST_HTTP_URL:}
scheduler.transform.post.http.method=${SCHEDULER_POST_HTTP_METHOD:GET}
scheduler.transform.post.http.authorization=${SCHEDULER_POST_HTTP_AUTH:}
scheduler.transform.post.http.connect-timeout-ms=${SCHEDULER_POST_HTTP_CONNECT_TIMEOUT:5000}
scheduler.transform.post.http.read-timeout-ms=${SCHEDULER_POST_HTTP_READ_TIMEOUT:30000}

# Database
# Database configuration - supports PostgreSQL, MySQL, CockroachDB at runtime
# All JDBC drivers are included in the build
quarkus.datasource.db-kind=${QUARKUS_DATASOURCE_DB_KIND:postgresql}
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/scheduler}
quarkus.datasource.username=scheduler
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:scheduler}
quarkus.datasource.jdbc.max-size=20

# Health
quarkus.health.extensions.enabled=true

# Logging
quarkus.log.category."net.maxf".level=DEBUG
quarkus.log.category."org.apache.camel".level=INFO

# Camel routes location (select kafka.xml or activemq.xml)
camel.main.routes-include-pattern=classpath:camel/kafka.xml

# OpenAPI / Swagger
quarkus.smallrye-openapi.info-title=PubSub Scheduler API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=REST API for managing scheduled jobs and instances
quarkus.smallrye-openapi.info-license-name=PolyForm Noncommercial 1.0.0
quarkus.smallrye-openapi.info-license-url=https://polyformproject.org/licenses/noncommercial/1.0.0
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
