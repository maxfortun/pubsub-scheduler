<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627" width="1200" height="627">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4facfe"/>
      <stop offset="100%" style="stop-color:#00f2fe"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="627" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.05" stroke="#4facfe" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="627"/>
    <line x1="400" y1="0" x2="400" y2="627"/>
    <line x1="600" y1="0" x2="600" y2="627"/>
    <line x1="800" y1="0" x2="800" y2="627"/>
    <line x1="1000" y1="0" x2="1000" y2="627"/>
  </g>

  <!-- Left side: Message envelope with clock -->
  <g transform="translate(280, 263)">
    <!-- Envelope body -->
    <rect x="0" y="0" width="120" height="80" rx="8" fill="#2d3a5a" stroke="url(#accentGrad)" stroke-width="2"/>
    <!-- Envelope flap -->
    <path d="M0 8 L60 45 L120 8" fill="none" stroke="url(#accentGrad)" stroke-width="2"/>

    <!-- Clock overlay -->
    <circle cx="100" cy="65" r="28" fill="#1a1a2e" stroke="url(#accentGrad)" stroke-width="2" filter="url(#glow)"/>
    <circle cx="100" cy="65" r="22" fill="none" stroke="#4facfe" stroke-width="1" opacity="0.5"/>
    <!-- Clock hands -->
    <line x1="100" y1="65" x2="100" y2="50" stroke="#00f2fe" stroke-width="2" stroke-linecap="round"/>
    <line x1="100" y1="65" x2="112" y2="65" stroke="#00f2fe" stroke-width="2" stroke-linecap="round"/>
    <circle cx="100" cy="65" r="3" fill="#00f2fe"/>
  </g>

  <!-- Center: Flow arrow with time markers -->
  <g transform="translate(430, 303)">
    <!-- Main arrow line -->
    <line x1="0" y1="0" x2="280" y2="0" stroke="url(#accentGrad)" stroke-width="3" stroke-dasharray="12,6"/>
    <!-- Arrow head -->
    <polygon points="280,0 265,-10 265,10" fill="#00f2fe"/>

    <!-- Time markers -->
    <g transform="translate(50, 0)">
      <circle r="8" fill="#4facfe" opacity="0.6"/>
      <text y="30" text-anchor="middle" fill="#8892b0" font-family="Arial, sans-serif" font-size="13">now</text>
    </g>
    <g transform="translate(140, 0)">
      <circle r="10" fill="#4facfe" opacity="0.8"/>
      <text y="30" text-anchor="middle" fill="#8892b0" font-family="Arial, sans-serif" font-size="13">+5min</text>
    </g>
    <g transform="translate(230, 0)">
      <circle r="12" fill="#00f2fe"/>
      <text y="30" text-anchor="middle" fill="#8892b0" font-family="Arial, sans-serif" font-size="13">deliver</text>
    </g>
  </g>

  <!-- Right side: Destination topic -->
  <g transform="translate(740, 263)">
    <!-- Topic box -->
    <rect x="0" y="0" width="120" height="80" rx="8" fill="#2d3a5a" stroke="url(#accentGrad)" stroke-width="2"/>
    <!-- Topic icon (3 horizontal lines) -->
    <line x1="15" y1="25" x2="105" y2="25" stroke="#4facfe" stroke-width="2" opacity="0.7"/>
    <line x1="15" y1="40" x2="85" y2="40" stroke="#4facfe" stroke-width="2" opacity="0.7"/>
    <line x1="15" y1="55" x2="65" y2="55" stroke="#4facfe" stroke-width="2" opacity="0.7"/>

    <!-- Checkmark -->
    <circle cx="100" cy="65" r="18" fill="#1a1a2e" stroke="#00f2fe" stroke-width="2"/>
    <path d="M90 65 L97 72 L110 58" fill="none" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title text -->
  <text x="600" y="150" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="52" font-weight="bold">
    PubSub Scheduler
  </text>

  <!-- Subtitle -->
  <text x="600" y="195" text-anchor="middle" fill="#8892b0" font-family="Arial, sans-serif" font-size="24">
    Delayed Message Delivery for Kafka
  </text>

  <!-- Bottom tagline -->
  <text x="600" y="540" text-anchor="middle" fill="#4facfe" font-family="Arial, sans-serif" font-size="20" opacity="0.8">
    Send now. Deliver later.
  </text>

  <!-- Decorative corner accents -->
  <path d="M30 30 L30 80 M30 30 L80 30" stroke="url(#accentGrad)" stroke-width="2" opacity="0.4"/>
  <path d="M1170 30 L1170 80 M1170 30 L1120 30" stroke="url(#accentGrad)" stroke-width="2" opacity="0.4"/>
  <path d="M30 597 L30 547 M30 597 L80 597" stroke="url(#accentGrad)" stroke-width="2" opacity="0.4"/>
  <path d="M1170 597 L1170 547 M1170 597 L1120 597" stroke="url(#accentGrad)" stroke-width="2" opacity="0.4"/>
</svg>