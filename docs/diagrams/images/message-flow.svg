<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 -10 940 580" width="940" height="580">
  <rect x="20" y="-10" width="940" height="580" fill="white"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1e1e1e"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .mono { font-family: 'SF Mono', Monaco, Consolas, monospace; }
  </style>
  <text x="500" y="43.8" font-size="28" fill="#1e1e1e" text-anchor="middle" >Message Flow &amp; Job Lifecycle</text>
  <rect x="50" y="80" width="180" height="100" fill="#d0ebff" stroke="#1971c2" stroke-width="1" rx="8" />
  <text x="60" y="98.6" font-size="16" fill="#1971c2" text-anchor="start" >1</text>
  <text x="80" y="101.9" font-size="14" fill="#1971c2" text-anchor="start" >INGEST</text>
  <text x="60" y="124.35" font-size="11" fill="#1e1e1e" text-anchor="start" >Message arrives at</text>
  <text x="60" y="137.54999999999998" font-size="11" fill="#1e1e1e" text-anchor="start" >scheduler.in topic</text>
  <text x="60" y="150.75" font-size="11" fill="#1e1e1e" text-anchor="start" >with SCHEDULER_*</text>
  <text x="60" y="163.95" font-size="11" fill="#1e1e1e" text-anchor="start" >headers</text>
  <line x1="235" y1="130" x2="275" y2="130" stroke="#1e1e1e" stroke-width="1"  marker-end="url(#arrowhead)"/>
  <rect x="280" y="80" width="180" height="100" fill="#fff3bf" stroke="#e67700" stroke-width="1" rx="8" />
  <text x="290" y="98.6" font-size="16" fill="#e67700" text-anchor="start" >2</text>
  <text x="310" y="101.9" font-size="14" fill="#e67700" text-anchor="start" >PRE-TRANSFORM</text>
  <text x="290" y="124.35" font-size="11" fill="#1e1e1e" text-anchor="start" >(Optional)</text>
  <text x="290" y="137.54999999999998" font-size="11" fill="#1e1e1e" text-anchor="start" >POST payload to</text>
  <text x="290" y="150.75" font-size="11" fill="#1e1e1e" text-anchor="start" >external service,</text>
  <text x="290" y="163.95" font-size="11" fill="#1e1e1e" text-anchor="start" >replace with response</text>
  <line x1="465" y1="130" x2="505" y2="130" stroke="#1e1e1e" stroke-width="1"  marker-end="url(#arrowhead)"/>
  <rect x="510" y="80" width="180" height="100" fill="#b2f2bb" stroke="#2f9e44" stroke-width="1" rx="8" />
  <text x="520" y="98.6" font-size="16" fill="#2f9e44" text-anchor="start" >3</text>
  <text x="540" y="101.9" font-size="14" fill="#2f9e44" text-anchor="start" >STORE</text>
  <text x="520" y="124.35" font-size="11" fill="#1e1e1e" text-anchor="start" >Job saved to DB</text>
  <text x="520" y="137.54999999999998" font-size="11" fill="#1e1e1e" text-anchor="start" >State: PENDING</text>
  <text x="520" y="150.75" font-size="11" fill="#1e1e1e" text-anchor="start" >Advisory: JOB_SCHEDULED</text>
  <line x1="695" y1="130" x2="735" y2="130" stroke="#1e1e1e" stroke-width="1"  marker-end="url(#arrowhead)"/>
  <rect x="740" y="80" width="180" height="100" fill="#e5dbff" stroke="#862e9c" stroke-width="1" rx="8" />
  <text x="750" y="98.6" font-size="16" fill="#862e9c" text-anchor="start" >4</text>
  <text x="770" y="101.9" font-size="14" fill="#862e9c" text-anchor="start" >QUEUE</text>
  <text x="750" y="124.35" font-size="11" fill="#1e1e1e" text-anchor="start" >Job added to</text>
  <text x="750" y="137.54999999999998" font-size="11" fill="#1e1e1e" text-anchor="start" >in-memory DelayQueue</text>
  <text x="750" y="150.75" font-size="11" fill="#1e1e1e" text-anchor="start" >waiting for fireAt time</text>
  <line x1="830" y1="185" x2="830" y2="225" stroke="#1e1e1e" stroke-width="1"  marker-end="url(#arrowhead)"/>
  <rect x="740" y="230" width="180" height="100" fill="#ffc9c9" stroke="#c92a2a" stroke-width="1" rx="8" />
  <text x="750" y="248.6" font-size="16" fill="#c92a2a" text-anchor="start" >5</text>
  <text x="770" y="251.9" font-size="14" fill="#c92a2a" text-anchor="start" >ACQUIRE</text>
  <text x="750" y="274.35" font-size="11" fill="#1e1e1e" text-anchor="start" >Time reached!</text>
  <text x="750" y="287.55" font-size="11" fill="#1e1e1e" text-anchor="start" >Optimistic lock in DB</text>
  <text x="750" y="300.75" font-size="11" fill="#1e1e1e" text-anchor="start" >State: ACQUIRED</text>
  <text x="750" y="313.95000000000005" font-size="11" fill="#1e1e1e" text-anchor="start" >Advisory: JOB_FIRING</text>
  <line x1="735" y1="280" x2="695" y2="280" stroke="#1e1e1e" stroke-width="1"  marker-end="url(#arrowhead)"/>
  <rect x="510" y="230" width="180" height="100" fill="#fff3bf" stroke="#e67700" stroke-width="1" rx="8" />
  <text x="520" y="248.6" font-size="16" fill="#e67700" text-anchor="start" >6</text>
  <text x="540" y="251.9" font-size="14" fill="#e67700" text-anchor="start" >POST-TRANSFORM</text>
  <text x="520" y="274.35" font-size="11" fill="#1e1e1e" text-anchor="start" >(Optional)</text>
  <text x="520" y="287.55" font-size="11" fill="#1e1e1e" text-anchor="start" >POST payload to</text>
  <text x="520" y="300.75" font-size="11" fill="#1e1e1e" text-anchor="start" >external service,</text>
  <text x="520" y="313.95000000000005" font-size="11" fill="#1e1e1e" text-anchor="start" >replace with response</text>
  <line x1="505" y1="280" x2="465" y2="280" stroke="#1e1e1e" stroke-width="1"  marker-end="url(#arrowhead)"/>
  <rect x="280" y="230" width="180" height="100" fill="#d0ebff" stroke="#1971c2" stroke-width="1" rx="8" />
  <text x="290" y="248.6" font-size="16" fill="#1971c2" text-anchor="start" >7</text>
  <text x="310" y="251.9" font-size="14" fill="#1971c2" text-anchor="start" >FIRE</text>
  <text x="290" y="274.35" font-size="11" fill="#1e1e1e" text-anchor="start" >Publish to</text>
  <text x="290" y="287.55" font-size="11" fill="#1e1e1e" text-anchor="start" >destination topic</text>
  <text x="290" y="300.75" font-size="11" fill="#1e1e1e" text-anchor="start" >State: COMPLETE</text>
  <text x="290" y="313.95000000000005" font-size="11" fill="#1e1e1e" text-anchor="start" >Advisory: JOB_DONE</text>
  <text x="50" y="395.3" font-size="18" fill="#495057" text-anchor="start" >Job States:</text>
  <rect x="50" y="410" width="100" height="30" fill="#b2f2bb" stroke="#2f9e44" stroke-width="1" rx="8" />
  <text x="70" y="426.35" font-size="11" fill="#1e1e1e" text-anchor="start" >PENDING</text>
  <rect x="170" y="410" width="100" height="30" fill="#e5dbff" stroke="#862e9c" stroke-width="1" rx="8" />
  <text x="190" y="426.35" font-size="11" fill="#1e1e1e" text-anchor="start" >WAITING</text>
  <rect x="290" y="410" width="100" height="30" fill="#fff3bf" stroke="#e67700" stroke-width="1" rx="8" />
  <text x="305" y="426.35" font-size="11" fill="#1e1e1e" text-anchor="start" >ACQUIRED</text>
  <rect x="410" y="410" width="100" height="30" fill="#ffc9c9" stroke="#c92a2a" stroke-width="1" rx="8" />
  <text x="435" y="426.35" font-size="11" fill="#1e1e1e" text-anchor="start" >FIRING</text>
  <rect x="530" y="410" width="100" height="30" fill="#d0ebff" stroke="#1971c2" stroke-width="1" rx="8" />
  <text x="545" y="426.35" font-size="11" fill="#1e1e1e" text-anchor="start" >COMPLETE</text>
  <rect x="650" y="410" width="100" height="30" fill="#dee2e6" stroke="#868e96" stroke-width="1" rx="8" />
  <text x="675" y="426.35" font-size="11" fill="#1e1e1e" text-anchor="start" >FAILED</text>
  <text x="50" y="485.3" font-size="18" fill="#495057" text-anchor="start" >Key Policies:</text>
  <text x="50" y="509.35" font-size="11" fill="#1e1e1e" text-anchor="start" >QUEUE: Wait for predecessor</text>
  <text x="50" y="522.5500000000001" font-size="11" fill="#1e1e1e" text-anchor="start" >WAITING -&gt; PENDING when done</text>
  <text x="320" y="509.35" font-size="11" fill="#1e1e1e" text-anchor="start" >REPLACE: Cancel existing jobs</text>
  <text x="320" y="522.5500000000001" font-size="11" fill="#1e1e1e" text-anchor="start" >with same key, schedule new</text>
  <text x="590" y="509.35" font-size="11" fill="#1e1e1e" text-anchor="start" >SKIP: Drop if job with</text>
  <text x="590" y="522.5500000000001" font-size="11" fill="#1e1e1e" text-anchor="start" >same key already exists</text>
</svg>