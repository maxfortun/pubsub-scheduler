<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 -10 870 770" width="870" height="770">
  <rect x="20" y="-10" width="870" height="770" fill="white"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1e1e1e"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .mono { font-family: 'SF Mono', Monaco, Consolas, monospace; }
  </style>
  <text x="600" y="43.8" font-size="28" fill="#1e1e1e" text-anchor="middle" >PubSub Scheduler - Deployment Options</text>
  <text x="50" y="95.3" font-size="18" fill="#1971c2" text-anchor="start" >1. Single Instance (Development)</text>
  <rect x="50" y="110" width="500" height="140" fill="#f8f9fa" stroke="#868e96" stroke-width="1" rx="8" />
  <rect x="80" y="130" width="100" height="50" fill="#ffec99" stroke="#1e1e1e" stroke-width="1" rx="8" />
  <text x="100" y="156.9" font-size="14" fill="#1e1e1e" text-anchor="start" >Kafka</text>
  <rect x="220" y="130" width="120" height="50" fill="#b2f2bb" stroke="#2f9e44" stroke-width="1" rx="8" />
  <text x="235" y="156.9" font-size="14" fill="#1e1e1e" text-anchor="start" >Scheduler</text>
  <ellipse cx="430" cy="155" rx="50" ry="25" fill="#d0bfff" stroke="#1e1e1e" stroke-width="1"/>
  <text x="395" y="155.2" font-size="12" fill="#1e1e1e" text-anchor="start" >PostgreSQL</text>
  <line x1="185" y1="155" x2="215" y2="155" stroke="#1e1e1e" stroke-width="1"  marker-end="url(#arrowhead)"/>
  <line x1="345" y1="155" x2="375" y2="155" stroke="#1e1e1e" stroke-width="1"  marker-end="url(#arrowhead)"/>
  <text x="80" y="211.9" font-size="14" fill="#495057" text-anchor="start" class="mono">docker-compose up -d</text>
  <text x="50" y="295.3" font-size="18" fill="#1971c2" text-anchor="start" >2. Sharded Cluster (Production)</text>
  <rect x="50" y="310" width="700" height="200" fill="#f8f9fa" stroke="#868e96" stroke-width="1" rx="8" />
  <rect x="80" y="340" width="120" height="80" fill="#ffec99" stroke="#1e1e1e" stroke-width="1" rx="8" />
  <text x="140" y="360.2" font-size="12" fill="#1e1e1e" text-anchor="middle" >Kafka Cluster</text>
  <text x="140" y="374.59999999999997" font-size="12" fill="#1e1e1e" text-anchor="middle" >(3 brokers)</text>
  <rect x="250" y="330" width="100" height="40" fill="#b2f2bb" stroke="#2f9e44" stroke-width="1" rx="8" />
  <text x="255" y="349.35" font-size="11" fill="#1e1e1e" text-anchor="start" >Scheduler-0</text>
  <rect x="250" y="380" width="100" height="40" fill="#b2f2bb" stroke="#2f9e44" stroke-width="1" rx="8" />
  <text x="255" y="399.35" font-size="11" fill="#1e1e1e" text-anchor="start" >Scheduler-1</text>
  <rect x="250" y="430" width="100" height="40" fill="#b2f2bb" stroke="#2f9e44" stroke-width="1" rx="8" />
  <text x="255" y="449.35" font-size="11" fill="#1e1e1e" text-anchor="start" >Scheduler-2</text>
  <ellipse cx="490" cy="400" rx="70" ry="40" fill="#d0bfff" stroke="#1e1e1e" stroke-width="1"/>
  <text x="490" y="395.2" font-size="12" fill="#1e1e1e" text-anchor="middle" >CockroachDB</text>
  <text x="490" y="409.59999999999997" font-size="12" fill="#1e1e1e" text-anchor="middle" >(3 nodes)</text>
  <text x="580" y="349.35" font-size="11" fill="#495057" text-anchor="start" >Each instance owns</text>
  <text x="580" y="362.55" font-size="11" fill="#495057" text-anchor="start" >1/3 of keys via</text>
  <text x="580" y="375.75" font-size="11" fill="#495057" text-anchor="start" >hash(key) % 3</text>
  <line x1="205" y1="380" x2="245" y2="380" stroke="#1e1e1e" stroke-width="1"  marker-end="url(#arrowhead)"/>
  <line x1="355" y1="400" x2="415" y2="400" stroke="#1e1e1e" stroke-width="1"  marker-end="url(#arrowhead)"/>
  <text x="50" y="555.3" font-size="18" fill="#1971c2" text-anchor="start" >3. With HTTP Transform (Claim Check)</text>
  <rect x="50" y="570" width="800" height="160" fill="#f8f9fa" stroke="#868e96" stroke-width="1" rx="8" />
  <rect x="80" y="600" width="80" height="40" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="1" rx="8" />
  <text x="90" y="619.35" font-size="11" fill="#1e1e1e" text-anchor="start" >Producer</text>
  <rect x="200" y="590" width="140" height="60" fill="#b2f2bb" stroke="#2f9e44" stroke-width="1" rx="8" />
  <text x="225" y="621.9" font-size="14" fill="#1e1e1e" text-anchor="start" >Scheduler</text>
  <rect x="380" y="590" width="100" height="30" fill="#fff3bf" stroke="#e67700" stroke-width="1" rx="8" />
  <text x="385" y="604.5" font-size="10" fill="#1e1e1e" text-anchor="start" >Pre-Transform</text>
  <rect x="520" y="590" width="80" height="50" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="1" rx="8" />
  <text x="535" y="616.9" font-size="14" fill="#1e1e1e" text-anchor="start" >S3</text>
  <ellipse cx="420" cy="680" rx="40" ry="20" fill="#d0bfff" stroke="#1e1e1e" stroke-width="1"/>
  <text x="397" y="680.2" font-size="12" fill="#1e1e1e" text-anchor="start" >DB</text>
  <rect x="640" y="590" width="100" height="30" fill="#fff3bf" stroke="#e67700" stroke-width="1" rx="8" />
  <text x="645" y="604.5" font-size="10" fill="#1e1e1e" text-anchor="start" >Post-Transform</text>
  <rect x="780" y="600" width="80" height="40" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="1" rx="8" />
  <text x="785" y="619.35" font-size="11" fill="#1e1e1e" text-anchor="start" >Consumer</text>
  <line x1="165" y1="620" x2="195" y2="620" stroke="#1e1e1e" stroke-width="1"  marker-end="url(#arrowhead)"/>
  <line x1="345" y1="605" x2="375" y2="605" stroke="#e67700" stroke-width="1"  marker-end="url(#arrowhead)"/>
  <line x1="485" y1="605" x2="515" y2="605" stroke="#1e1e1e" stroke-width="1"  marker-end="url(#arrowhead)"/>
  <line x1="605" y1="605" x2="635" y2="605" stroke="#1e1e1e" stroke-width="1"  marker-end="url(#arrowhead)"/>
  <line x1="745" y1="605" x2="775" y2="605" stroke="#e67700" stroke-width="1"  marker-end="url(#arrowhead)"/>
  <text x="490" y="668.5" font-size="10" fill="#495057" text-anchor="start" >Large payload stored</text>
  <text x="490" y="680.5" font-size="10" fill="#495057" text-anchor="start" >in S3, ref in DB</text>
  <text x="640" y="638.5" font-size="10" fill="#495057" text-anchor="start" >Fetch from S3</text>
  <text x="640" y="650.5" font-size="10" fill="#495057" text-anchor="start" >before firing</text>
</svg>