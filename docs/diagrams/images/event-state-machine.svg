<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9e44"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c92a2a"/>
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e67700"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="680" fill="#fafafa"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e1e1e">Advisory Event State Machine</text>

  <!-- Message Arrives -->
  <rect x="350" y="60" width="160" height="40" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/>
  <text x="430" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#495057">Message Arrives</text>

  <!-- Entry States -->
  <rect x="180" y="160" width="130" height="50" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
  <text x="245" y="190" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#1864ab">JOB_QUEUED</text>

  <rect x="550" y="160" width="130" height="50" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
  <text x="615" y="190" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#1864ab">JOB_CHAINED</text>

  <!-- Cancelled: SKIPPED -->
  <rect x="730" y="160" width="130" height="50" rx="8" fill="#ffec99" stroke="#e67700" stroke-width="2"/>
  <text x="795" y="190" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#e67700">JOB_SKIPPED</text>

  <!-- Cancelled: REPLACED -->
  <rect x="20" y="280" width="130" height="50" rx="8" fill="#ffec99" stroke="#e67700" stroke-width="2"/>
  <text x="85" y="310" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#e67700">JOB_REPLACED</text>

  <!-- Transitions -->
  <rect x="550" y="280" width="130" height="50" rx="8" fill="#b2f2bb" stroke="#5c940d" stroke-width="2"/>
  <text x="615" y="310" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#37b24d">JOB_PROMOTED</text>

  <rect x="350" y="380" width="130" height="50" rx="8" fill="#b2f2bb" stroke="#5c940d" stroke-width="2"/>
  <text x="415" y="410" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#37b24d">JOB_RUNNING</text>

  <!-- Failed: CASCADE -->
  <rect x="730" y="280" width="150" height="50" rx="8" fill="#ffc9c9" stroke="#c92a2a" stroke-width="2"/>
  <text x="805" y="310" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#c92a2a">JOB_CASCADE_FAILED</text>

  <!-- Success exits -->
  <rect x="180" y="480" width="130" height="50" rx="8" fill="#69db7c" stroke="#2f9e44" stroke-width="2"/>
  <text x="245" y="510" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#2f9e44">JOB_COMPLETE</text>

  <rect x="180" y="580" width="130" height="50" rx="8" fill="#d8f5a2" stroke="#5c940d" stroke-width="2"/>
  <text x="245" y="610" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#5c940d">JOB_EXPIRED</text>

  <!-- Failed exit -->
  <rect x="520" y="480" width="130" height="50" rx="8" fill="#ffc9c9" stroke="#c92a2a" stroke-width="2"/>
  <text x="585" y="510" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#c92a2a">JOB_FAILED</text>

  <!-- Arrows from Message Arrives -->
  <path d="M380 100 L260 155" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M480 100 L600 155" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M510 80 L730 180" fill="none" stroke="#e67700" stroke-width="2" marker-end="url(#arrowhead-orange)"/>

  <!-- Labels on entry arrows -->
  <text x="290" y="120" font-family="Arial, sans-serif" font-size="11" fill="#1971c2">ready</text>
  <text x="500" y="120" font-family="Arial, sans-serif" font-size="11" fill="#1971c2">QUEUE policy</text>
  <text x="620" y="110" font-family="Arial, sans-serif" font-size="11" fill="#e67700">SKIP policy</text>

  <!-- Arrow from QUEUED to RUNNING -->
  <path d="M280 210 L400 375" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="310" y="290" font-family="Arial, sans-serif" font-size="11" fill="#555">scheduled time</text>

  <!-- Arrow from QUEUED to REPLACED -->
  <path d="M180 190 L150 190 L150 280" fill="none" stroke="#e67700" stroke-width="2" marker-end="url(#arrowhead-orange)"/>
  <text x="60" y="240" font-family="Arial, sans-serif" font-size="10" fill="#e67700">REPLACE arrives</text>

  <!-- Arrow from CHAINED to PROMOTED -->
  <path d="M615 210 L615 275" fill="none" stroke="#2f9e44" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <text x="625" y="248" font-family="Arial, sans-serif" font-size="10" fill="#2f9e44">predecessor done</text>

  <!-- Arrow from CHAINED to CASCADE_FAILED -->
  <path d="M680 190 L720 190 L780 275" fill="none" stroke="#c92a2a" stroke-width="2" marker-end="url(#arrowhead-red)"/>
  <text x="710" y="230" font-family="Arial, sans-serif" font-size="10" fill="#c92a2a">predecessor failed</text>

  <!-- Arrow from PROMOTED to RUNNING -->
  <path d="M550 310 L480 390" fill="none" stroke="#2f9e44" stroke-width="2" marker-end="url(#arrowhead-green)"/>

  <!-- Arrow from RUNNING to COMPLETE -->
  <path d="M380 430 L270 475" fill="none" stroke="#2f9e44" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <text x="290" y="455" font-family="Arial, sans-serif" font-size="11" fill="#2f9e44">success</text>

  <!-- Arrow from RUNNING to FAILED -->
  <path d="M450 430 L560 475" fill="none" stroke="#c92a2a" stroke-width="2" marker-end="url(#arrowhead-red)"/>
  <text x="490" y="455" font-family="Arial, sans-serif" font-size="11" fill="#c92a2a">failure</text>

  <!-- Arrow from COMPLETE to EXPIRED -->
  <path d="M245 530 L245 575" fill="none" stroke="#5c940d" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <text x="255" y="558" font-family="Arial, sans-serif" font-size="11" fill="#5c940d">if recurring</text>

  <!-- Loop arrow from COMPLETE back to RUNNING -->
  <path d="M310 490 L340 490 L340 430 L350 420" fill="none" stroke="#5c940d" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead-green)"/>
  <text x="345" y="465" font-family="Arial, sans-serif" font-size="10" fill="#5c940d">repeat</text>

  <!-- Legend -->
  <rect x="700" y="420" width="180" height="200" rx="8" fill="#fff" stroke="#dee2e6" stroke-width="1"/>
  <text x="790" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e1e1e">Legend</text>

  <rect x="720" y="460" width="20" height="20" rx="4" fill="#a5d8ff" stroke="#1971c2" stroke-width="1"/>
  <text x="750" y="475" font-family="Arial, sans-serif" font-size="12" fill="#1e1e1e">Entry states</text>

  <rect x="720" y="490" width="20" height="20" rx="4" fill="#b2f2bb" stroke="#5c940d" stroke-width="1"/>
  <text x="750" y="505" font-family="Arial, sans-serif" font-size="12" fill="#1e1e1e">Transitions</text>

  <rect x="720" y="520" width="20" height="20" rx="4" fill="#69db7c" stroke="#2f9e44" stroke-width="1"/>
  <text x="750" y="535" font-family="Arial, sans-serif" font-size="12" fill="#1e1e1e">Success exits</text>

  <rect x="720" y="550" width="20" height="20" rx="4" fill="#ffec99" stroke="#e67700" stroke-width="1"/>
  <text x="750" y="565" font-family="Arial, sans-serif" font-size="12" fill="#1e1e1e">Cancelled</text>

  <rect x="720" y="580" width="20" height="20" rx="4" fill="#ffc9c9" stroke="#c92a2a" stroke-width="1"/>
  <text x="750" y="595" font-family="Arial, sans-serif" font-size="12" fill="#1e1e1e">Failed</text>
</svg>
