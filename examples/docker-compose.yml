services:
  # PostgreSQL database
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: scheduler
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Kafka (KRaft mode, no ZooKeeper)
  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  # PubSub Scheduler
  scheduler:
    image: maxfortun/pubsub-scheduler:latest
    ports:
      - "8080:8080"
    environment:
      QUARKUS_PROFILE: kafka
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/scheduler
      QUARKUS_DATASOURCE_USERNAME: scheduler
      QUARKUS_DATASOURCE_PASSWORD: scheduler
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CAMEL_COMPONENT_KAFKA_BROKERS: kafka:9092
      SCHEDULER_IN: kafka:scheduler.in
      SCHEDULER_ADVISORY: kafka:scheduler.advisory
      SCHEDULER_DLQ: kafka:scheduler.dlq
      SCHEDULER_ADVISORY_DLQ: kafka:scheduler.advisory.dlq
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/q/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
